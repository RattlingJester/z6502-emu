FEATURES {
    STARTADDRESS: default = $FF00;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0100;
    __STACKSTART__: type = weak, value = $0200;
    __ZPSTART__:    type = weak, value = $0000;
}
MEMORY {
    ZP:   file = "", define = yes, start = __ZPSTART__, size = $0100;
    MAIN: file = %O,               start = $0000,       size = $10000, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = MAIN, type = rw, start = $FF00;
    VECTORS:  load = MAIN, type = ro, start = $FFFA;
}
