MEMORY {
    ZP:   file = "", define = yes, start = $0000, size = $0100;
    MAIN: file = %O,               start = $0000, size = $10000, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = MAIN, type = bss, start = $0200;
    IO:       load = MAIN, type = bss, start = $D010;
    CODE:     load = MAIN, type = ro,  start = $FF00;
    VECTORS:  load = MAIN, type = ro,  start = $FFFA;
}
